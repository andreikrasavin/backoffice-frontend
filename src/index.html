<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Backoffice — мебельная фабрика</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // Marks the document as dark before the first paint to avoid a light flash.
      (function () {
        try {
          if (localStorage.getItem('bf-theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (error) {
          // Storage may be unavailable (private mode); the light theme is used.
        }
      })();
    </script>
  </head>
  <body>
    <bf-root></bf-root>
    <script>
      // Loaded at the end of the body so the dark bundle overrides the light
      // NgZorro component styles instead of being overridden by them.
      (function () {
        try {
          if (localStorage.getItem('bf-theme') !== 'dark') {
            return;
          }
          var link = document.createElement('link');
          link.id = 'bf-theme-dark';
          link.rel = 'stylesheet';
          link.href = new URL(
            'assets/ng-zorro-antd/ng-zorro-antd.dark.min.css',
            document.baseURI,
          ).href;
          document.head.appendChild(link);
        } catch (error) {
          // Storage or DOM may be unavailable; fall back to the light theme.
        }
      })();
    </script>
  </body>
</html>
